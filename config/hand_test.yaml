# One-joint RH56DFX test. Official Unitree position: 0=closed, 1=open.
hand: left
joint: ring

# Signed normalized travel. Positive opens; negative closes.
delta: 0.3

# Time for the outward movement. Return uses the same duration.
move_duration_ms: 5000

# Time held at the target before returning.
hold_ms: 2000
